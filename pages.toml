# Pages and sources. No secrets here: tokens live only in the DB (`pages connect`).

# voice: a macOS `say` name locally, a Polly name when PAGES_TTS=polly.
[pages.podcastbawaal]
pipeline = "clips"
voice = "Aman"
window = [9, 23]
daily_target = 1
theme = {hot = "#7c5cff", sun = "#ffd23f", font = "Bricolage Grotesque"}
music = []
clips_per_video = 3

[pages.billikalesh]
active = true
pipeline = "animals"
voice = "Tara"
window = [9, 23]
daily_target = 1
theme = {hot = "#ff8a3d", sun = "#ffe066", font = "Poppins"}
music = []
topics = "cats, dogs, wild animals and nature: one surprising fact or behaviour explained per reel"
queries = ["funny cat", "cat compilation", "dog reacts", "funny dog", "wildlife moment", "animal fails"]

# Set from what the API actually does (verify-ig).
[api]
copyright_check = false
trial_reels = false
collaborators = false
follower_type_views = false

[[sources]]
id = "pexels"
page = "billikalesh"
kind = "pexels"
url = "https://www.pexels.com"
permission = {licence = "Pexels License"}

