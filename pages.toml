# Pages and sources. No secrets here: tokens live only in the DB (`pages connect`).

# voice: a macOS `say` name locally, a Polly name when PAGES_TTS=polly.
[pages.podcastbawaal]
pipeline = "clips"
voice = "Aman"
window = [9, 23]
daily_target = 1
theme = {hot = "#7c5cff", sun = "#ffd23f", font = "Bricolage Grotesque"}
music = ["music/circuit-synthwave-alt.mp3", "music/lofi-beat-loafy.mp3", "music/synthwave-electropop.mp3"]
sfx = true
clips_per_video = 3

# topics feed the clip layer and caption prompts (writing._topics).
[pages.tech_bawaal]
active = true
pipeline = "clips"
voice = "Tara"
window = [9, 23]
daily_target = 2
theme = {hot = "#256dfd", sun = "#5cff3a", font = "Poppins"}
music = ["music/trap-deep-bass-nesmartu.mp3", "music/trap-mafia-game-notmeat2020.mp3", "music/trap-beat-hscoa.mp3"]
music_volume = 0.60
sfx = true
clips_per_video = 3
topics = "tech and AI: launches, hot takes, founders, AI tools and debates, gadgets, and how it works engineering and science explainers"
hook_style = "headline"
brand_tag = "TECH BAWAAL"
avatar = "assets/pages/tech_bawaal/avatar.jpg"
formats = {clip = 2, montage = 1, rapidfire = 1}
montage_music = ["music/trap-mafia-game-notmeat2020.mp3"]  # the 152 bpm bed both montage previews were approved on
queries = ["how it works machine", "engineering explained", "factory process", "robot arm", "physics experiment", "satisfying machine", "how it's made", "gadget teardown"]

# Set from what the API actually does (verify-ig).
[api]
copyright_check = false
trial_reels = false
collaborators = false
follower_type_views = false
# Meta's AI info label: only for AI generated or altered realistic video or audio (e.g. a synthetic voice).
# Clips are real footage with on screen text, so it stays off.
ai_label = false
