<h1>Data deletion</h1>
<p>Musubi Pages manages only Instagram accounts owned by Musubi. It stores API tokens, media ids and insights.</p>
<p>To delete your data, email <a href="mailto:developer@musubiclip.com">developer@musubiclip.com</a>, or remove the app under Instagram &gt; Settings &gt; Apps and websites. Data is deleted within 30 days.</p>
